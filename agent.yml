env:
  WEB_BINDING: "0.0.0.0:23001"
  MANAGED: true
  REMOTE_CONFIG_SERVERS: ["http://localhost:29000"]
  REMOTE_CONFIG_INTERVAL: "1s"
  ENROLLMENT_TOKEN: ""
  SECURITY_ENABLED: true
  SECURITY_MANAGED_ENABLED: false

path.data: data
path.logs: log
path.configs: "config"
configs.auto_reload: true

resource_limit.cpu.max_num_of_cpus: 1
resource_limit:
  memory:
    max_in_bytes: 533708800 # ~510MB (soft limit + RSS watchdog)

task:
  max_concurrent_tasks: 3

stats:
  include_storage_stats_in_api: false

elastic:
  skip_init_metadata_on_start: true
  metadata_refresh:
    enabled: false
  health_check:
    enabled: true
    interval: 60s
  availability_check:
    enabled: false
    interval: 60s

disk_queue:
  max_msg_size: 20485760
  max_bytes_per_file: 20485760
  max_used_bytes: 8589934592 # 8GB
  retention.max_num_of_local_files: 1
  compress:
    idle_threshold: 1
    num_of_files_decompress_ahead: 0
    segment:
      enabled: true

api:
  disable_api_directory: true
  enabled: false

web:
  embedding_api: false
  enabled: true
  network:
    binding: $[[env.WEB_BINDING]]
  ui:
    vfs: true
#  tls:
#    enabled: true
#    cert_file: /etc/ssl.crt
#    key_file: /etc/ssl.key
#    skip_insecure_verify: false
  security:
    enabled: $[[env.SECURITY_ENABLED]]
    managed: $[[env.SECURITY_MANAGED_ENABLED]]
    authentication:
      access_token:
        enabled: true

metrics:
  enabled: true

configs:
  #for managed client's setting
  managed: $[[env.MANAGED]] # managed by remote servers
  panic_on_config_error: false #ignore config error
  allow_generated_metrics_tasks: false # allow auto-generated metrics tasks (e.g. k8s)
  interval: $[[env.REMOTE_CONFIG_INTERVAL]]
  servers: $[[env.REMOTE_CONFIG_SERVERS]] # config servers
  enrollment_token: $[[env.ENROLLMENT_TOKEN]] # one-time registration pass (required when the server sets enrollment.required; pass via -e ENROLLMENT_TOKEN=et-...)
  max_backup_files: 5
  soft_delete: false
#  tls: #for mTLS connection with config servers
#    enabled: true
#    cert_file: /etc/ssl.crt
#    key_file: /etc/ssl.key
#    skip_insecure_verify: false

# ---------------------------------------------------------------------------
# Log pipeline egress (opt-in): process collected logs and ship them to
# the gateway's OTLP/gRPC intake via the enterprise processors.
#
# Flow: logs_processor writes envelopes to the local "logs" disk queue ->
# consumer drains batches -> for_each splits records and runs the
# enterprise transform chain (dissect + field_standardize) in place ->
# otlp_export ships one OTLP ExportLogsServiceRequest to the gateway.
#
# Enable by setting enabled:true and pointing endpoint at the gateway.
# ---------------------------------------------------------------------------
pipeline:
  - name: logs_otlp_egress
    enabled: false
    auto_start: true
    keep_running: true
    singleton: true
    processor:
      - consumer:
          queue_selector:
            keys:
              - logs
          consumer:
            group: agent-logs-otlp
          message_field: messages
          processor:
            - for_each:
                message_field: messages
                processor:
                  - dissect:
                      pattern: "%{log_level} %{service_name}: %{remainder}"
                      ignore_failure: true
                  - field_standardize:
                      mode: underscore
                      normalize_case: true
            - otlp_export:
                endpoint: "127.0.0.1:4317"
                insecure: true
                timeout: 10s
                message_field: messages

# ---------------------------------------------------------------------------
# Syslog collection (opt-in): listen for RFC3164/RFC5424 messages and
# feed them onto the local "logs" queue in the same envelope as file
# collection, so the shared processing chain (consumer -> for_each ->
# dissect/field_standardize -> otlp_export) applies unchanged.
#
# Point remote syslog senders at this address, e.g. in rsyslog:
#   *.* @127.0.0.1:5140        # UDP
#   *.* @@127.0.0.1:5140       # TCP
# ---------------------------------------------------------------------------
  - name: syslog_intake
    enabled: false
    auto_start: true
    keep_running: true
    processor:
      - syslog_processor:
          protocol: udp
          bind: ":5140"
          queue_name: logs

# ---------------------------------------------------------------------------
# Kafka output (opt-in): route the local queues to Kafka instead of the
# disk queue. With kafka_queue.default=true the existing queue.Push
# calls publish to Kafka unchanged — no code change needed.
#
# disk_queue:
#   default: false
# kafka_queue:
#   enabled: true
#   default: true
#   brokers:
#     - "127.0.0.1:9092"
#   num_of_partition: 1
#   num_of_replica: 1
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# File collection follow-tail (opt-in): set scan_interval on the
# logs_processor to keep re-scanning the logs path while the agent runs
# (close-to-live tailing plus rename/move-safe offset inheritance):
#
#   - logs_processor:
#       scan_interval: 2s
#       patterns:
#         - pattern: '\.log$'
#           type: text
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Direct-ship mode (opt-in): file sources can bypass the local queue
# entirely — the file itself plus offset checkpoints provide durability
# (offsets only advance after successful delivery), so the same bytes
# are not written to disk twice. Envelopes are batched in memory
# (ship_batch_size / ship_flush_interval) and shipped straight to the
# gateway's OTLP intake with load balancing, failover and retries.
# ship_config takes the same keys as the otlp_export processor.
#
# The consumer -> for_each -> otlp_export egress pipeline above is NOT
# needed for a ship_direct source; enterprise edge processors can still
# run via the queue path by leaving ship_direct off.
#
# pipeline:
#   - name: logs_intake
#     auto_start: true
#     keep_running: true
#     processor:
#       - logs:
#           queue_name: logs
#           ship_direct: true
#           ship_batch_size: 500        # events per in-flight batch
#           ship_flush_interval: 1s     # flush at least this often
#           ship_config:
#             endpoints:
#               - "127.0.0.1:4317"
#             insecure: true
#             timeout: 10s
#           scan_interval: 2s
#           logs_path: /var/log/myapp
#           patterns:
#             - pattern: '\.log$'
#               type: text
# ---------------------------------------------------------------------------
