env:
  WEB_BINDING: "0.0.0.0:23000"
  MANAGED: false
  REMOTE_CONFIG_SERVERS: ["http://localhost:22000"]
  REMOTE_CONFIG_INTERVAL: "1s"
  SECURITY_ENABLED: true
  SECURITY_MANAGED_ENABLED: false

path.data: data
path.logs: log
path.configs: "config"
configs.auto_reload: true

resource_limit.cpu.max_num_of_cpus: 1
resource_limit:
  memory:
    max_in_bytes: 533708800 #50MB

task:
  max_concurrent_tasks: 3

stats:
  include_storage_stats_in_api: false

elastic:
  skip_init_metadata_on_start: true
  metadata_refresh:
    enabled: false
  health_check:
    enabled: true
    interval: 60s
  availability_check:
    enabled: false
    interval: 60s

disk_queue:
  max_msg_size: 20485760
  max_bytes_per_file: 20485760
  max_used_bytes: 8589934592 # 8GB
  retention.max_num_of_local_files: 1
  compress:
    idle_threshold: 1
    num_of_files_decompress_ahead: 0
    segment:
      enabled: true

api:
  disable_api_directory: true
  enabled: false

web:
  embedding_api: false
  enabled: true
  network:
    binding: $[[env.WEB_BINDING]]
  ui:
    vfs: true
#  tls:
#    enabled: true
#    cert_file: /etc/ssl.crt
#    key_file: /etc/ssl.key
#    skip_insecure_verify: false
  security:
    enabled: $[[env.SECURITY_ENABLED]]
    managed: $[[env.SECURITY_MANAGED_ENABLED]]
    authentication:
      access_token:
        enabled: true

agent:

metrics:
  enabled: true

configs:
  #for managed client's setting
  managed: $[[env.MANAGED]] # managed by remote servers
  panic_on_config_error: false #ignore config error
  allow_generated_metrics_tasks: false # allow auto-generated metrics tasks (e.g. k8s)
  interval: $[[env.REMOTE_CONFIG_INTERVAL]]
  servers: $[[env.REMOTE_CONFIG_SERVERS]] # config servers
  max_backup_files: 5
  soft_delete: false
#  tls: #for mTLS connection with config servers
#    enabled: true
#    cert_file: /etc/ssl.crt
#    key_file: /etc/ssl.key
#    skip_insecure_verify: false

# ---------------------------------------------------------------------------
# Log pipeline egress (opt-in): process collected logs and ship them to
# the gateway's OTLP/gRPC intake via the enterprise processors.
#
# Flow: logs_processor writes envelopes to the local "logs" disk queue ->
# consumer drains batches -> for_each splits records and runs the
# enterprise transform chain (dissect + field_standardize) in place ->
# otlp_export ships one OTLP ExportLogsServiceRequest to the gateway.
#
# Enable by setting enabled:true and pointing endpoint at the gateway.
# ---------------------------------------------------------------------------
pipeline:
  - name: logs_otlp_egress
    enabled: false
    auto_start: true
    keep_running: true
    singleton: true
    processor:
      - consumer:
          queue_selector:
            keys:
              - logs
          consumer:
            group: agent-logs-otlp
          message_field: messages
          processor:
            - for_each:
                message_field: messages
                processor:
                  - dissect:
                      pattern: "%{log_level} %{service_name}: %{remainder}"
                      ignore_failure: true
                  - field_standardize:
                      mode: underscore
                      normalize_case: true
            - otlp_export:
                endpoint: "127.0.0.1:4317"
                insecure: true
                timeout: 10s
                message_field: messages
